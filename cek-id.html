
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek ID - SiBike Lock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 180 100">
                    <circle cx="35" cy="62" r="25"/>
                    <circle cx="145" cy="62" r="25"/>
                    <path d="M35 62 L65 20 L90 62 L35 62 L55 35 L95 35 L110 62 L145 62"/>
                    <path d="M65 20 L80 20 M55 35 L45 20"/>
                    <path d="M135 20 L155 20 M145 20 L155 45"/>
                    <path class="lock-shackle" d="M75 35 V18 A15 15 0 0 1 105 18 V35"/>
                    <rect class="lock-body" x="70" y="35" width="40" height="42" rx="5"/>
                    <circle class="lock-hole" cx="90" cy="51" r="5"/>
                    <path class="lock-hole" d="M87 53 L93 53 L91 65 L89 65 Z"/>
                    <path class="signal" d="M127 78 Q140 65 153 78"/>
                    <path class="signal" d="M132 84 Q140 76 148 84"/>
                    <circle class="signal-dot" cx="140" cy="89" r="3"/>
                </svg>
            </div>

            <h2><span>Si</span> Bike Lock</h2>
            <p class="tagline">SMART • SECURE • CONNECTED</p>
            <div class="logo-line"></div>
        </div>

        <div class="cekid-heading">
            <h1>Masukkan<br>ID</h1>
            <p>Pastikan ID anda benar</p>
        </div>

        <form class="cekid-form" onsubmit="return checkID()">

            <input
                type="text"
                id="userID"
                placeholder="(kolom ID)"
                required
            >

            <button type="submit">CEK</button>

            <p id="errorMessage"></p>

        </form>

    </div>

    <script src="script.js"></script>
</body>
</html>
