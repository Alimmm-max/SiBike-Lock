<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek ID - SiBike Lock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="logo">
    <img src="logo-sibike.png"
         alt="Logo SiBike Lock"
         class="logo-image">
</div>

        <div class="cekid-heading">
            <h1>Masukkan<br>ID</h1>
            <p>Pastikan ID anda benar</p>
        </div>

        <form class="cekid-form" onsubmit="return checkID()">

            <input
                type="text"
                id="userID"
                placeholder="(kolom ID)"
                required
            >

            <button type="submit">CEK</button>

            <p id="errorMessage"></p>

        </form>

    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
