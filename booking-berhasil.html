<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Berhasil - SiBike Lock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container success-container">

        <div class="logo">
    <img src="logo-sibike.png"
         alt="Logo SiBike Lock"
         class="logo-image">
</div>

        <div class="success-heading">
            <h1>Booking<br>Berhasil</h1>
            <p>Segera parkirkan sepeda anda! PIN hanya berlaku 15 menit</p>
        </div>

        <div class="success-grid">

            <div class="success-item">
                <div class="success-label">Slot</div>
                <div class="success-value" id="successSlot">-</div>
            </div>

            <div class="success-item">
                <div class="success-label">PIN</div>
                <div class="success-value" id="successPIN">-</div>
            </div>

            <div class="success-item">
                <div class="success-label">Status</div>
                <div class="success-value" id="successStatus">-</div>
            </div>

            <div class="success-item">
                <div class="success-label">Berlaku</div>
                <div class="success-value" id="countdown">00 : 15 : 00</div>
            </div>

        </div>

        <p id="successMessage" class="success-message"></p>

        <a href="index.html" class="back-button">
            Kembali ke Menu Utama
        </a>

    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
