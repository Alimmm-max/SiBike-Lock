<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Parkir - SiBike Lock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container status-container">

       <div class="logo">
    <img src="logo-sibike.png"
         alt="Logo SiBike Lock"
         class="logo-image">
</div>

        <div class="status-heading">
            <h1>Status<br>Parkir</h1>
            <p>Pastikan Keamanan Sepeda Anda!</p>
        </div>

        <div class="status-grid">

            <div class="status-item">
                <div class="status-label">Slot</div>
                <div class="status-value" id="slotStatus">-</div>
            </div>

            <div class="status-item">
                <div class="status-label">Status</div>
                <div class="status-value" id="lockStatus">-</div>
            </div>

            <div class="status-item">
                <div class="status-label">Waktu masuk</div>
                <div class="status-value" id="entryTime">-</div>
            </div>

            <div class="status-item">
                <div class="status-label">Keamanan</div>
                <div class="status-value" id="securityStatus">-</div>
            </div>

        </div>

        <p id="statusMessage" class="status-message"></p>

        <a href="index.html" class="back-button">
            Kembali
        </a>

    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
